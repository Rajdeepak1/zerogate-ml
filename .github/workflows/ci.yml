name: ZeroGate CI & Lifecycle Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-zerogate-engine:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Gateway Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Build ML Worker Docker Image & Register Cold Container
        run: |
          docker build -t zerogate-worker:v1 ./worker
          docker create --name zg-ml-worker -p 8001:8001 zerogate-worker:v1
          docker ps -a

      - name: 5. Boot ZeroGate Control Plane & Test Cold Start + Micro-Batching
        run: |
          uvicorn gateway.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          echo "--- Testing Cold Start Wake-Up ---"
          curl -s -f -X POST http://localhost:8000/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "CI pipeline cold start verification"}' | python -m json.tool
          echo "--- Checking Gateway Status ---"
          curl -s -f http://localhost:8000/v1/status | python -m json.tool
